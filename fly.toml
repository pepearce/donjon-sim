app = 'donjon-sim'
primary_region = 'lhr'

kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]

[env]
  DONJON_DB = '/data/donjon.sqlite'
  DONJON_PORT = '8787'
  DONJON_ADMIN_PORT = '8788'
  DONJON_API = 'http://127.0.0.1:8787'
  DONJON_ADMIN = 'http://127.0.0.1:8788'
  DONJON_SPEED = '1'
  DONJON_LOG_LEVEL = 'info'

[[mounts]]
  source = 'donjon_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 150
    hard_limit = 250

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
